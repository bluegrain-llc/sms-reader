name: RequestRelay
options:
  bundleIdPrefix: com.bluegrain
  deploymentTarget:
    iOS: '17.0'
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: $(RELAY_APPLE_TEAM)
    CODE_SIGN_STYLE: Automatic
    RELAY_HOST: relay.invalid
    RELAY_URL: https://relay.invalid
    GOOGLE_REVERSED_CLIENT_ID: configure-google-client
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.8.0
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RequestRelay:
    type: application
    platform: iOS
    sources: [RequestRelay]
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
    info:
      path: RequestRelay/Info.plist
      properties:
        CFBundleDisplayName: Request Relay
        UILaunchScreen: {}
        RelayURL: $(RELAY_URL)
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        FirebaseAnalyticsCollectionEnabled: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: Scan an agent registration or connection QR code.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: RequestRelay/RequestRelay.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: [applinks:$(RELAY_HOST)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluegrain.smsrelay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APNS_ENVIRONMENT: development
  RequestRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RequestRelayTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RequestRelay
  RequestRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RequestRelayUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RequestRelay
schemes:
  RequestRelay:
    build:
      targets:
        RequestRelay: all
    test:
      targets: [RequestRelayTests, RequestRelayUITests]
