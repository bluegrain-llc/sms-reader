name: iOS companion
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ios/RequestRelay.xcodeproj -scheme RequestRelay
      - name: Build, unit tests and simulator UI tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -project ios/RequestRelay.xcodeproj -scheme RequestRelay -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -resultBundlePath ios-results.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: ios-results.xcresult
