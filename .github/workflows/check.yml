name: CI and delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-unit:
    name: Server unit tests and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./sdks/python
      - run: npm run test:cli
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:cloud-harness
      - run: npm run test:capacity-tools
      - name: Monitoring configuration tests
        run: python3 -m unittest discover -s scripts/monitoring -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - run: npm audit --omit=dev

  server-integration:
    name: Firestore, Auth, REST and MCP integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust
      - run: npx tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --esModuleInterop --strict --skipLibCheck --allowJs server/test/*.ts scripts/capture-compat.mts
      - run: node --import tsx scripts/capture-compat.mts
      - run: node scripts/bundle-onboarding-qr.mjs
      - run: git diff --exit-code -- server/public/onboarding-qr.js
      - run: npm run contracts:onboarding
      - run: git diff --exit-code -- contracts
      - run: git diff --exit-code -- server-rust/compat
      - run: npm run test:contract
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firebase-emulator-logs
          path: '*-debug.log'
          retention-days: 7

  cloud-probe:
    name: Staging callback probe container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f scripts/cloud-acceptance/Dockerfile -t relay-cloud-probe:local .
      - run: docker run --rm relay-cloud-probe:local node --check scripts/cloud-acceptance/receiver.mjs
      - name: Refuse an unconfigured callback probe
        run: |
          if docker run --rm relay-cloud-probe:local > /tmp/probe-startup.log 2>&1; then
            echo 'An unconfigured probe must not start.' >&2
            exit 1
          fi
          grep -q staging_receiver_configuration_required /tmp/probe-startup.log
      - run: docker save relay-cloud-probe:local | gzip > /tmp/probe-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: staging-callback-probe-container
          path: /tmp/probe-image.tar.gz
          retention-days: 7

  container:
    name: Container build and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f server/Dockerfile -t sms-code-relay:local .
      - run: scripts/container-smoke.sh
      - run: |
          docker save sms-code-relay:local | gzip > /tmp/relay-image.tar.gz
          cd /tmp
          sha256sum relay-image.tar.gz > relay-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: relay-container
          path: |
            /tmp/relay-image.tar.gz
            /tmp/relay-image.sha256
          retention-days: 7

  rust:
    name: Rust format, Clippy, tests, dependency audit and container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust
      - run: cargo fmt --manifest-path server-rust/Cargo.toml --check
      - run: cargo clippy --manifest-path server-rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path server-rust/Cargo.toml --locked
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --file server-rust/Cargo.lock
      - run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f server-rust/Dockerfile -t sms-code-relay:rust .
      - run: IMAGE=sms-code-relay:rust scripts/container-smoke.sh
      - name: Archive tested Rust candidate
        run: |
          docker save sms-code-relay:rust | gzip > /tmp/relay-rust-image.tar.gz
          cd /tmp
          sha256sum relay-rust-image.tar.gz > relay-rust-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: relay-rust-container
          path: |
            /tmp/relay-rust-image.tar.gz
            /tmp/relay-rust-image.sha256
          retention-days: 7

  android-unit:
    name: Android unit tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-and-lint-reports
          path: android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-integration:
    name: Android UI integration (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 36]
    needs: android-unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Free unused toolchains for emulator storage
        run: |
          : "${ANDROID_HOME:?Android SDK location is required}"
          sudo rm -rf /usr/share/dotnet "$ANDROID_HOME/ndk"
          df -h "$ANDROID_HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.bluegrain.smsrelay.ApprovalScreenTest,com.bluegrain.smsrelay.NavigationScreenTest,com.bluegrain.smsrelay.NotificationNavigationTest,com.bluegrain.smsrelay.ListenerStatusTest,com.bluegrain.smsrelay.OnboardingScreenTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-reports-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7

  deliver:
    name: Publish tested container
    needs: [server-unit, server-integration, cloud-probe, container, rust, android-unit, android-integration, onboarding-browser, sdk-transports]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relay-container
          path: /tmp/relay-container
      - name: Load and tag the tested image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gzip -dc /tmp/relay-container/relay-image.tar.gz | docker load
          image="ghcr.io/${REPOSITORY,,}"
          echo "RELAY_IMAGE=$image" >> "$GITHUB_ENV"
          docker tag sms-code-relay:local "$image:$COMMIT_SHA"
          docker tag sms-code-relay:local "$image:latest"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push versioned and latest images
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "$RELAY_IMAGE:$COMMIT_SHA"
          docker push "$RELAY_IMAGE:latest"
          echo "Container: \`$RELAY_IMAGE:$COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  onboarding-browser:
    name: Focused browser onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  sdk-transports:
    name: SDK process transports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: python3 scripts/generate-sdk-transports.py
      - run: git diff --exit-code -- sdks
      - run: cd sdks/go && go test ./...
      - run: cargo test --manifest-path sdks/rust/Cargo.toml --locked
      - run: ruby sdks/ruby/test.rb
      - run: php sdks/php/test.php
      - run: |
          mvn -q -f sdks/java/pom.xml package dependency:build-classpath -Dmdep.outputFile=/tmp/relay-sdk-classpath
          java -cp "sdks/java/target/classes:sdks/java/target/test-classes:$(cat /tmp/relay-sdk-classpath)" llc.bluegrain.relay.Smoke "$PWD/scripts/sdk-broker-fixture.py"
      - run: dotnet run --project sdks/test-dotnet/Smoke.csproj -- "$PWD/scripts/sdk-broker-fixture.py"
