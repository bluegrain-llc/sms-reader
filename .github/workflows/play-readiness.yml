name: Play release readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-gate-unit:
    name: Play release gate unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned bundletool for AAPT protobuf regressions
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
        run: |
          curl --fail --silent --show-error --location --max-time 90 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$BUNDLETOOL_JAR"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$BUNDLETOOL_JAR" | sha256sum --check
      - run: python3 -m unittest discover -s scripts -p 'test_play_release.py'
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool-all-1.18.3.jar
